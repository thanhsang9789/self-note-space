<!DOCTYPE html>
<html lang="en" data-scroll-behavior="smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e0f2fe" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#02031a" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SelfNote" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Choose a space to store personal notes on tactile paper or read and write anonymous letters. Syncs across cellphone and desktop." />

  <title>SelfNote.</title>

  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script id="theme-mode-preinit">
    (function () {
      try {
        var pref = localStorage.getItem("unsaid_mode") || "system";
        var mode = pref;
        if (pref === "system") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-mode", mode);
        if (mode === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="font-sans antialiased">
  <!-- Top Pink Navigation Progress Bar -->
  <div id="nav-progress" class="nav-progress" aria-hidden="true">
    <div id="nav-progress-bar" class="nav-progress-bar"></div>
  </div>

  <!-- Main SPA Mount -->
  <div id="app" class="page-transition"></div>

  <!-- Modal / Sheet Root -->
  <div id="modal-root"></div>

  <!-- Toast Root -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Persistent Bottom-Left Floating Controls (Theme Toggle + Cloud Sync / Brand Settings) -->
  <div class="floating-dock-left">
    <button id="theme-toggle-btn" type="button" class="glass-circle-btn" aria-label="Toggle color mode" title="Toggle Light / Dark Mode">
      <span id="theme-toggle-icon"></span>
    </button>
    <button id="settings-open-btn" type="button" class="glass-circle-btn settings-btn" aria-label="Cloud Sync & Branding Settings" title="Cloud Sync, Backup & Branding">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
      </svg>
      <span id="sync-status-dot" class="sync-status-dot" title="Local storage active"></span>
    </button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
